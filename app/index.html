<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Expense Tracker · AWS Serverless</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- decorative animated background -->
<div class="orbs" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

<header class="topbar">
  <div class="brand">
    <span class="logo">💸</span>
    <div>
      <h1>Expense&nbsp;Tracker</h1>
      <p class="tag">serverless · AWS eu-central-1</p>
    </div>
  </div>
  <div class="user-area">
    <span id="whoami" class="chip hidden"></span>
    <button id="btnLogout" class="btn ghost hidden" type="button">Sign out</button>
  </div>
</header>

<main>

  <!-- ═══════════ AUTH ═══════════ -->
  <section id="authScreen" class="auth-wrap">
    <div class="card auth-card">
      <h2>Welcome 👋</h2>
      <p class="muted">Sign in or create an account. Accounts are handled by <b>Amazon Cognito</b>.</p>

      <label class="field">
        <span>Email</span>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
      </label>
      <label class="field">
        <span>Password</span>
        <input id="password" type="password" placeholder="min 8 chars, 1 upper, 1 number" autocomplete="current-password" />
      </label>

      <div class="row">
        <button id="btnSignIn" class="btn primary" type="button">Sign in</button>
        <button id="btnSignUp" class="btn ghost" type="button">Create account</button>
      </div>

      <p class="hint">Demo account: <code>demo.cijo@example.com</code> / <code>Testpass1</code></p>
    </div>
  </section>

  <!-- ═══════════ APP ═══════════ -->
  <section id="appScreen" class="hidden">

    <div id="kpis" class="kpis"></div>

    <div class="grid">
      <div class="card">
        <div class="card-head">
          <h3>Spend by category</h3>
          <span class="muted" id="chartTotal"></span>
        </div>
        <div id="chart" class="chart"></div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Add an expense</h3></div>
        <form id="addForm" class="form-grid">
          <label class="field"><span>Amount</span>
            <input id="f-amount" type="number" step="0.01" min="0.01" placeholder="0.00" required />
          </label>
          <label class="field"><span>Currency</span>
            <select id="f-currency"></select>
          </label>
          <label class="field"><span>Category</span>
            <select id="f-category"></select>
          </label>
          <label class="field"><span>Date</span>
            <input id="f-date" type="date" />
          </label>
          <label class="field span2"><span>Note</span>
            <input id="f-note" placeholder="e.g. Team lunch" />
          </label>
          <button class="btn primary span2" type="submit">＋ Add expense</button>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-head wrap-head">
        <h3>Expenses <span id="listCount" class="count"></span></h3>
        <div class="filters">
          <input id="fq" class="search" type="search" placeholder="🔍 Search notes…" />
          <select id="filterCategory"></select>
          <select id="sortBy">
            <option value="date_desc">Newest first</option>
            <option value="date_asc">Oldest first</option>
            <option value="amount_desc">Highest amount</option>
            <option value="amount_asc">Lowest amount</option>
          </select>
          <button id="btnExport" class="btn ghost small" type="button">⬇ CSV</button>
        </div>
      </div>
      <div id="list" class="list"></div>
    </div>
  </section>

</main>

<div id="toasts" class="toasts"></div>
<div id="modalRoot" class="modal-root hidden"></div>

<script src="app.js"></script>
</body>
</html>
